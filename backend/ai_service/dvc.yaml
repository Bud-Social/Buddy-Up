# DVC pipeline for Buddy-Up datasets.
# Stages are no-op until datasets are added under data/raw.

stages:
  process-food:
    cmd: python training/process_food_data.py
    deps:
      - data/raw
    outs:
      - data/processed/food
  process-forms:
    cmd: python training/process_workout_videos.py
    deps:
      - data/Work out vids dataset 2
      - data/Work out vids dataset 3
      - data/Work out vids dataset 4
      - data/Work out vids dataset 5
      - data/Work out vids dataset 6
    outs:
      - data/processed/forms

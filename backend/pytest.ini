[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers -v --tb=short --cov=. --cov-report=term --cov-report=xml --cov-config=.coveragerc --ignore=ai_service
# ai_service/ has its own stack (fastapi/torch/onnxruntime, tested under ml-env):
# backend/.venv cannot import it, so it is excluded from Django test collection.
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests

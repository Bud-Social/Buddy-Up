[pytest]
# config.settings.test is config.settings.development plus a cheap password
# hasher. Django >=5.0 no longer installs that override automatically, and
# production PBKDF2 costs ~0.78s per create_user -- hundreds of seconds across
# the suite. See the module docstring for the full story.
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers -v --tb=short --cov=. --cov-report=term --cov-report=xml --cov-config=.coveragerc --ignore=ai_service
# ai_service/ has its own stack (fastapi/torch/onnxruntime, tested under ml-env):
# backend/.venv cannot import it, so it is excluded from Django test collection.
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests

version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buddyup_internal

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buddyup_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8002 config.asgi:application"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - AFRICASTALKING_API_KEY=${AFRICASTALKING_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE}
      - MPESA_PASSKEY=${MPESA_PASSKEY}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
      - AGORA_APP_ID=${AGORA_APP_ID}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://rtc.buddyup.app}
      - LIVEKIT_INTERNAL_URL=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVE_RECORDING_S3_ENDPOINT=http://minio:9000
      - LIVE_RECORDING_S3_BUCKET=buddyup-replays
      - LIVE_RECORDING_S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - LIVE_RECORDING_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - LIVE_REPLAY_BASE_URL=${LIVE_REPLAY_BASE_URL:-https://buddyup.app/replays}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SENTRY_DSN=${SENTRY_DSN}
      - RELEASE_VERSION=${RELEASE_VERSION:-docker}
      - RELEASE_COMMIT=${RELEASE_COMMIT:-unknown}
      - METRICS_TOKEN=${METRICS_TOKEN}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    networks:
      - buddyup_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  livekit:
    image: livekit/livekit-server:v1.8
    restart: always
    command: --config /etc/livekit.yaml
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_TURN_DOMAIN=${LIVEKIT_TURN_DOMAIN}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - ./nginx/ssl:/etc/livekit-certs:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "50000-50100:50000-50100/udp"
    networks:
      - buddyup_internal
    depends_on:
      - redis

  livekit-egress:
    image: livekit/egress:v1.6
    restart: always
    environment:
      - EGRESS_CONFIG_FILE=/etc/livekit-egress.yaml
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_INTERNAL_URL=ws://livekit:7880
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./livekit-egress.yaml:/etc/livekit-egress.yaml:ro
    networks:
      - buddyup_internal
    depends_on:
      - livekit
      - redis
      - minio

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - buddyup_internal

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    restart: "no"
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/buddyup-replays;
      mc anonymous set private local/buddyup-replays"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    networks:
      - buddyup_internal
    depends_on:
      - minio

  # ── AI MICROSERVICE ────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./backend/ai_service
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --workers 2
    environment:
      - AI_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - AI_LOG_LEVEL=INFO
      - AI_MODEL_CACHE_DIR=/models
      - AI_HF_HOME=/models/hf
      - AI_API_KEY=${AI_API_KEY}
      - AI_OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ai_models:/models
    networks:
      - buddyup_internal
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: always
    command: >
      celery -A config.celery worker
        --loglevel=warning
        --concurrency=8
        -Q default,high_priority,media,ai
        --max-tasks-per-child=1000
    env_file:
      - path: .env.prod
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FLUTTERWAVE_WEBHOOK_HASH=${FLUTTERWAVE_WEBHOOK_HASH}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY}
      - KES_PER_USD=${KES_PER_USD}
      - SENTRY_DSN=${SENTRY_DSN}
      - RELEASE_VERSION=${RELEASE_VERSION:-docker}
      - RELEASE_COMMIT=${RELEASE_COMMIT:-unknown}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - LIVEKIT_INTERNAL_URL=http://livekit:7880
      - LIVE_RECORDING_S3_ENDPOINT=http://minio:9000
      - LIVE_RECORDING_S3_BUCKET=buddyup-replays
      - LIVE_RECORDING_S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - LIVE_RECORDING_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - LIVE_REPLAY_BASE_URL=${LIVE_REPLAY_BASE_URL:-https://buddyup.app/replays}
    networks:
      - buddyup_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: always
    command: >
      celery -A config.celery beat
        --loglevel=warning
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - path: .env.prod
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FLUTTERWAVE_WEBHOOK_HASH=${FLUTTERWAVE_WEBHOOK_HASH}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY}
      - KES_PER_USD=${KES_PER_USD}
      - SENTRY_DSN=${SENTRY_DSN}
      - RELEASE_VERSION=${RELEASE_VERSION:-docker}
      - RELEASE_COMMIT=${RELEASE_COMMIT:-unknown}
      - METRICS_TOKEN=${METRICS_TOKEN}
    networks:
      - buddyup_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_WS_BASE_URL=${VITE_WS_BASE_URL}
        - VITE_LIVEKIT_URL=${VITE_LIVEKIT_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
        - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME}
        - VITE_FIREBASE_CONFIG=${VITE_FIREBASE_CONFIG}
    restart: always
    networks:
      - buddyup_internal

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - ./nginx/admin_allowlist.conf:/etc/nginx/admin_allowlist.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_static:/var/www/static:ro
      - backend_media:/media:ro
    networks:
      - buddyup_internal
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  minio_data:
  ai_models:

networks:
  buddyup_internal:
    driver: bridge

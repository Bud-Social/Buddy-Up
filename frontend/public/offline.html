<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Offline — BuddyUp Fit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0A0A;
      color: #E0E0E0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .container { text-align: center; max-width: 360px; }
    .icon { width: 80px; height: 80px; margin: 0 auto 24px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; color: #FFFFFF; }
    p { font-size: 0.95rem; line-height: 1.5; color: #A0A0A0; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 999px;
      background: #00C896;
      color: #0A0A0A;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn:hover { background: #00E0A8; }
    .status { font-size: 0.8rem; color: #666; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="48" stroke="#00C896" stroke-width="4" stroke-dasharray="8 4"/>
      <path d="M50 30v20l15 10" stroke="#00C896" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h1>You're offline</h1>
    <p>Connect to the internet to keep using BuddyUp Fit. Your saved content will be available once you're back online.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <p class="status">BuddyUp Fit will automatically resume when connectivity is restored.</p>
  </div>
  <script>
    // Escape hatch (?clear-sw=1): unregister every service worker, wipe all
    // caches, then reload clean — mirrors the support link in main.tsx.
    if (location.search.indexOf('clear-sw=1') !== -1) {
      var wipe = Promise.resolve();
      if ('serviceWorker' in navigator) {
        wipe = wipe.then(function () {
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        });
      }
      if ('caches' in window) {
        wipe = wipe.then(function () {
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        });
      }
      wipe.then(function () { window.location.replace('/'); });
    }

    // Recovery for anyone who reached this page while actually online:
    // ask the browser to re-check /sw.js right now instead of waiting for
    // its 24h update cadence, and reload the moment a new worker takes
    // control of this tab — the fixed worker no longer serves this page
    // for navigations, so the reload lands in the real app.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        window.location.reload();
      });
      var pokeSW = function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg) reg.update();
        });
      };
      pokeSW();
      window.addEventListener('online', function () {
        pokeSW();
        window.location.reload();
      });
    } else {
      window.addEventListener('online', function () { window.location.reload(); });
    }
  </script>
</body>
</html>

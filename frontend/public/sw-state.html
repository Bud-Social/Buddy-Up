<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Service Worker Diagnostics — BuddyUp Fit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0A0A0A; color: #E0E0E0; padding: 24px; min-height: 100dvh; }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin-bottom: 4px; color: #fff; }
    p.sub { font-size: 0.85rem; color: #A0A0A0; margin-bottom: 20px; }
    .row { background: #141414; border: 1px solid #1E1E1E; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; font-size: 0.85rem; word-break: break-all; }
    .row b { color: #fff; display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #00C896; margin-bottom: 4px; }
    .btn { display: block; width: 100%; padding: 14px; margin-top: 12px; border-radius: 999px; background: #00C896; color: #0A0A0A; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; }
    .btn.ghost { background: transparent; border: 1px solid #333; color: #E0E0E0; }
    #log { margin-top: 16px; font-family: monospace; font-size: 0.75rem; color: #A0A0A0; white-space: pre-wrap; }
    .ok { color: #00C896; } .bad { color: #FF6B6B; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Connection diagnostics</h1>
    <p class="sub">BuddyUp Fit — read this out when reporting an offline issue.</p>
    <div class="row"><b>Browser online signal</b><span id="r-online">…</span></div>
    <div class="row"><b>Controlling worker</b><span id="r-controller">…</span></div>
    <div class="row"><b>Registrations</b><span id="r-regs">…</span></div>
    <div class="row"><b>Caches</b><span id="r-caches">…</span></div>
    <div class="row"><b>Heartbeat (real request)</b><span id="r-beat">…</span></div>
    <button class="btn" id="b-fix">Unregister workers, wipe caches &amp; reload</button>
    <button class="btn ghost" id="b-home">Back to BuddyUp Fit</button>
    <div id="log"></div>
  </div>
  <script>
    function log(m) {
      var el = document.getElementById('log');
      el.textContent += m + '\n';
    }
    async function diagnose() {
      document.getElementById('r-online').textContent = navigator.onLine ? 'online' : 'OFFLINE';
      if (!('serviceWorker' in navigator)) {
        document.getElementById('r-controller').textContent = 'service workers unsupported';
        document.getElementById('r-regs').textContent = 'n/a';
      } else {
        var c = navigator.serviceWorker.controller;
        document.getElementById('r-controller').textContent = c ? c.scriptURL + ' [' + c.state + ']' : 'none (page uncontrolled)';
        try {
          var regs = await navigator.serviceWorker.getRegistrations();
          document.getElementById('r-regs').textContent = regs.length
            ? regs.map(function (r) { return (r.active ? r.active.scriptURL + ' [active]' : 'no active worker') + ' scope=' + r.scope; }).join(' | ')
            : 'none registered';
        } catch (e) { document.getElementById('r-regs').textContent = 'error: ' + e; }
      }
      try {
        var keys = await caches.keys();
        var parts = [];
        for (var k of keys) {
          var cache = await caches.open(k);
          var reqs = await cache.keys();
          parts.push(k + ' (' + reqs.length + ' entries)');
        }
        document.getElementById('r-caches').textContent = parts.length ? parts.join(' | ') : 'no caches';
      } catch (e) { document.getElementById('r-caches').textContent = 'error: ' + e; }
      try {
        var res = await fetch('/offline.html', { method: 'HEAD', cache: 'no-store' });
        var el = document.getElementById('r-beat');
        el.textContent = res.ok ? 'reachable (' + res.status + ')' : 'FAILED (' + res.status + ')';
        el.className = res.ok ? 'ok' : 'bad';
      } catch (e) {
        var el2 = document.getElementById('r-beat');
        el2.textContent = 'FAILED: ' + e;
        el2.className = 'bad';
      }
    }
    document.getElementById('b-fix').onclick = async function () {
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var r of regs) { await r.unregister(); log('unregistered ' + r.scope); }
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          for (var k of keys) { await caches.delete(k); log('deleted cache ' + k); }
        }
      } catch (e) { log('reset error: ' + e); }
      log('reloading clean…');
      setTimeout(function () { window.location.replace('/'); }, 500);
    };
    document.getElementById('b-home').onclick = function () { window.location.href = '/'; };
    diagnose();
  </script>
</body>
</html>

version: "3.9"

services:

  # ── DATABASE ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: buddyup_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: buddyup_dev
      POSTGRES_USER: buddyup
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddyup -d buddyup_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── REDIS ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: buddyup_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI MICROSERVICE ────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./backend/ai_service
      dockerfile: Dockerfile
    container_name: buddyup_ai_service
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    environment:
      - AI_REDIS_URL=redis://redis:6379/0
      - AI_LOG_LEVEL=DEBUG
      - AI_MODEL_CACHE_DIR=/models
      - AI_OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
    volumes:
      - ./backend/ai_service/app:/app/app
      - ./backend/ai_service/models:/models
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
    # GPU is optional — the service degrades gracefully to CPU.
    # nvidia deploy block removed for rootless podman compatibility.

  # ── BACKEND (Django + Daphne) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: buddyup_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
              daphne -b 0.0.0.0 -p 8002 config.asgi:application"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgresql://buddyup:${DB_PASSWORD:-devpassword}@db:5432/buddyup_dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3002,http://frontend:3002
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - AGORA_APP_ID=${AGORA_APP_ID}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_INTERNAL_URL=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET}
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  # ── SELF-HOSTED WEBRTC (development) ────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: buddyup_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── CELERY WORKER ─────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: buddyup_celery_worker
    restart: unless-stopped
    command: >
      celery -A config.celery worker
        --loglevel=info
        --concurrency=4
        -Q default,high_priority,media,ai
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgresql://buddyup:${DB_PASSWORD:-devpassword}@db:5432/buddyup_dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── CELERY BEAT (SCHEDULER) ───────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: buddyup_celery_beat
    restart: unless-stopped
    command: >
      celery -A config.celery beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgresql://buddyup:${DB_PASSWORD:-devpassword}@db:5432/buddyup_dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── FRONTEND (Vite Dev Server) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: buddyup_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 3002
    environment:
      - VITE_API_BASE_URL=http://localhost:8002/api/v1
      - VITE_WS_BASE_URL=ws://localhost:8002
      - VITE_AGORA_APP_ID=${VITE_AGORA_APP_ID}
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
      - VITE_FIREBASE_CONFIG=${VITE_FIREBASE_CONFIG}
      - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json;

    # Allow composer media uploads (client caps at 50 MB; headroom for
    # multipart overhead). Without this nginx rejects >1 MB bodies with 413.
    client_max_body_size 60m;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream backend {
        server backend:8002;
    }

    upstream ai-service {
        server ai-service:8003;
    }

    server {
        listen 80;
        server_name buddyup.app www.buddyup.app;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name buddyup.app www.buddyup.app;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers (see security_headers.conf — re-included inside
        # locations that set their own add_header, per nginx inheritance rules).
        include /etc/nginx/security_headers.conf;

        # ── Frontend (React SPA) ──────────────────────────────────────
        root /var/www/frontend;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
            include /etc/nginx/security_headers.conf;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security_headers.conf;
        }

        # ── Backend API ───────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Django Admin ──────────────────────────────────────────────
        location /admin/ {
            include /etc/nginx/admin_allowlist.conf;
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ── Static files (Django) ─────────────────────────────────────
        location /static/ {
            alias  /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security_headers.conf;
        }

        # ── User media (local-storage fallback when Cloudinary off) ──
        location /media/ {
            alias  /media/;
            expires 7d;
            add_header Cache-Control "public";
            include /etc/nginx/security_headers.conf;
        }

        # Self-hosted replay objects. The bucket is never exposed directly.
        location /replays/ {
            proxy_pass http://minio:9000/buddyup-replays/replays/;
            proxy_set_header Host $host;
            proxy_hide_header x-amz-request-id;
        }

        # ── AI Service API ────────────────────────────────────────────
        location /ai/ {
            proxy_pass         http://ai-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── WebSocket ─────────────────────────────────────────────────
        location /ws/ {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     86400s;
            proxy_send_timeout     86400s;
        }
    }

    # LiveKit signalling endpoint; media travels directly over the published
    # ICE/TURN ports rather than through this HTTP reverse proxy.
    server {
        listen 443 ssl http2;
        server_name rtc.buddyup.app;
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass http://livekit:7880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

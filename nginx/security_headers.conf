# Shared security headers. Include this at server level AND inside any
# location block that defines its own add_header directives — nginx drops
# inherited add_header rules the moment a location sets its own.
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-XSS-Protection          "1; mode=block" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
# Google Sign-In opens a popup and polls window.closed — a stricter COOP
# breaks the handshake.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Media lives on Cloudinary; maps tile from OSM/CARTO/Esri (all keyless).
# geocoding: nominatim.openstreetmap.org ; social: Google Identity.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com https://server.arcgisonline.com https://ssl.gstatic.com https://*.googleusercontent.com; media-src 'self' blob: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://api.buddyup.app wss://buddyup.app wss://api.buddyup.app wss://rtc.buddyup.app https://accounts.google.com https://nominatim.openstreetmap.org https://www.googleapis.com; frame-src https://accounts.google.com; worker-src 'self' blob:;" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
redis:
  address: redis:6379
  password: ${REDIS_PASSWORD}
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
logging:
  level: info
  format: text
turn:
  enabled: true
  udp_port: 3478
  tls_port: 5349
  domain: ${LIVEKIT_TURN_DOMAIN}
  cert_file: /etc/livekit-certs/fullchain.pem
  key_file: /etc/livekit-certs/privkey.pem
ingress:
  enabled: false
egress:
  enabled: true

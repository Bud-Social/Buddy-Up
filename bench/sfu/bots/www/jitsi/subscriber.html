<!doctype html>
<html><head><meta charset="utf-8"><title>Jitsi subscriber bench</title>
<script>
// Redirect to the real Jitsi Meet shell with startSilent=true — the URL
// overwrite gives silent-viewer mode (no local tracks created) which is
// exactly the "pure viewer" scenario this bench measures.
const room = new URLSearchParams(location.search).get('room') || 'benchroom';
location.replace('/jitsi-app/' + encodeURIComponent(room) + '#config.startSilent=true');
</script>
</head><body></body></html>

port: 7890
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7891
  port_range_start: 50200
  port_range_end: 50220
  # Host-published ports forward to the container via slirp/rootless-podman,
  # so we must announce 127.0.0.1 as the ICE host, not the container IP.
  node_ip: 127.0.0.1
  use_external_ip: false
redis:
  address: host.containers.internal:6379
keys:
  benchkey: benchsecret
logging:
  level: info
